name: Build macOS app (launcher_app only)

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: launcher_app (macos build only)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error
