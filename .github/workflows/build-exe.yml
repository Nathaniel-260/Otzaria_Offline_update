name: Build EXE (launcher_app only)

on:
  workflow_dispatch:

jobs:
  build-exe:
    name: launcher_app (windows build only)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package portable build
        shell: pwsh
        run: .\windows_stub\package.ps1
        env:
          PAYLOAD_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-windows-portable
          path: launcher_app/build/*.exe
          if-no-files-found: error
