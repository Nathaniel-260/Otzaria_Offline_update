name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        description: מספר הגרסה שהוצב בקבצים שנבנו
        value: ${{ jobs.version.outputs.version }}
      tag:
        description: התג שבו יפורסם ה-release
        value: ${{ jobs.version.outputs.tag }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          current="$(sed -n 's/^version:[[:space:]]*//p' launcher_app/pubspec.yaml | head -1 | cut -d+ -f1 | tr -d '[:space:]')"
          major="${current%%.*}"; rest="${current#*.}"
          minor="${rest%%.*}"
          minor=$((minor + 1))
          while git rev-parse -q --verify "refs/tags/v$major.$minor.0" >/dev/null; do
            minor=$((minor + 1))
          done
          echo "version=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "tag=v$major.$minor.0" >> "$GITHUB_OUTPUT"
          echo "מ-$current אל $major.$minor (תג v$major.$minor.0)"

  linux_checks:
    name: analyze + native zstd (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_NATIVE_ZSTD: "1"
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-linux_checks
      - name: seforim_library_updater
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: library_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: library_manager
        run: flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: otzaria_l10n
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: otzaria_l10n
        run: dart pub get && dart analyze
      - name: otzaria_downloads
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: otzaria_downloads
        run: dart pub get && dart analyze
      - name: otzaria_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: otzaria_manager
        run: dart pub get && dart analyze
      - name: plugins_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: plugins_manager
        run: dart pub get && dart analyze
      - name: custom_apps_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: custom_apps_manager
        run: dart pub get && dart analyze
      - name: error_reports_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: error_reports_manager
        run: dart pub get && dart analyze

  dart_packages_macos:
    name: dart packages (test) (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: dart
        uses: dart-lang/setup-dart@v1
      - name: otzaria_manager
        if: ${{ !cancelled() && steps.dart.outcome == 'success' }}
        working-directory: otzaria_manager
        run: dart pub get && dart test
      - name: error_reports_manager
        if: ${{ !cancelled() && steps.dart.outcome == 'success' }}
        working-directory: error_reports_manager
        run: dart pub get && dart test
      - name: plugins_manager
        if: ${{ !cancelled() && steps.dart.outcome == 'success' }}
        working-directory: plugins_manager
        run: dart pub get && dart test
      - name: custom_apps_manager
        if: ${{ !cancelled() && steps.dart.outcome == 'success' }}
        working-directory: custom_apps_manager
        run: dart pub get && dart test

  launcher_app:
    name: launcher_app (analyze + windows build)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version
        if: inputs.release
        shell: bash
        run: bash ../tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-build
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-build
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build windows --release
      - name: Package portable build
        shell: pwsh
        run: .\windows_stub\package.ps1
        env:
          PAYLOAD_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-windows-portable-ci
          path: launcher_app/build/*.exe
          if-no-files-found: error

  launcher_app_macos:
    name: launcher_app (analyze + macos build)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version
        if: inputs.release
        run: bash ../tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build macos --release
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error

  launcher_app_macos_test:
    name: launcher_app + flutter packages (test) (macos-latest)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version
        if: inputs.release
        run: bash ../tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: library_manager
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: library_manager
        run: flutter pub get && flutter test
      - name: seforim_library_updater
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: .
        run: flutter pub get && flutter test

  coverage:
    name: tests + coverage (windows, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: launcher_app
            packages: launcher_app
            flutter: true
          - shard: flutter_packages
            packages: library_manager
            flutter: true
          - shard: dart_a
            packages: otzaria_manager,otzaria_l10n,otzaria_downloads
            flutter: false
          - shard: dart_b
            packages: plugins_manager,custom_apps_manager,error_reports_manager
            flutter: false
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        if: ${{ !matrix.flutter }}
      - uses: subosito/flutter-action@v2
        if: ${{ matrix.flutter }}
        with:
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-coverage-${{ matrix.shard }}
      - run: dart pub global activate coverage 1.15.1
        if: ${{ !matrix.flutter }}
      - run: dart tool/coverage.dart --collect "--packages=${{ matrix.packages }}" --min=60 --target=0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            build/coverage/lcov.info
            build/coverage/run.log
            */build/coverage/lcov.info
            */build/coverage/run.log
          if-no-files-found: error

  coverage_total:
    name: tests + coverage (total)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: dart tool/coverage.dart --min=60 --target=80
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-coverage
          path: |
            build/coverage/lcov.info
            build/coverage/run.log
            build/coverage/summary.json
            */build/coverage/lcov.info
            */build/coverage/run.log
          if-no-files-found: error
