name: otzaria_offline_update
description: >-
  כלי המאגר שבשורש: כיסוי הבדיקות (tool/coverage.dart) וכלי מדידה של ה-hash
  הלוגי. מנוע העדכון עצמו הוא החבילה seforim_library_updater של
  Otzaria/otzaria_library_updater.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # TODO: לעבור לתג של Otzaria/otzaria_library_updater אחרי מיזוג #27.
  seforim_library_updater:
    git:
      url: https://github.com/palmoni5/otzaria_library_updater.git
      ref: 2e16a4cd170cac4b8d1bf86e90cbfe980c0f5c7b
  sqlite3: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.1
  flutter_lints: ^4.0.0
